name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lazytest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LAZYDB_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/lazytest?timeout=5s
      LAZYDB_SSH_HOST: 127.0.0.1
      LAZYDB_SSH_PORT: "2222"
      LAZYDB_SSH_USER: runner
      LAZYDB_SSH_KEY: /home/runner/.ssh/id_ed25519
      LAZYDB_SSH_TARGET_HOST: 127.0.0.1
      LAZYDB_SSH_TARGET_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install and start sshd (tunnel test target)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222
          # 主机指纹（#31）：known_hosts 默认路径 + 显式指纹覆盖各验一条
          ssh-keyscan -p 2222 127.0.0.1 >> ~/.ssh/known_hosts
          # 指纹取 sshd 实际服务的 key（keyscan 来），不读磁盘文件——
          # runner 的 sshd host key 路径与 /etc/ssh/ssh_host_ed25519_key.pub 不保证一致
          echo "LAZYDB_SSH_FINGERPRINT=$(ssh-keyscan -p 2222 127.0.0.1 2>/dev/null | ssh-keygen -lf - | awk '/ED25519/{print $2; exit}')" >> "$GITHUB_ENV"
      - name: Vet
        run: go vet ./...
      - name: Test (unit + MySQL/SSH integration, SQLite test source)
        run: go test -count=1 -timeout 300s ./...
      - name: Build CGO_ENABLED=0
        run: CGO_ENABLED=0 go build ./...
  matrix:
    # 驱动代理与主程序的三平台产物（#22 ADR-0002）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build driver agent + main
        run: |
          $env:CGO_ENABLED = "0" ; go build -o lazydb-driver-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/lazydb-driver ; go build -o lazydb-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/lazydb
        if: matrix.goos == 'windows'
        shell: pwsh
      - name: Build driver agent + main
        run: |
          # macOS Keychain 要求 cgo（见 Makefile 注释）；driver 不碰钥匙串，保持静态
          CGO_ENABLED=0 go build -o lazydb-driver-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/lazydb-driver
          CGO_ENABLED=${{ matrix.goos == 'darwin' && '1' || '0' }} go build -o lazydb-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/lazydb
        if: matrix.goos != 'windows'
        shell: bash
      # macOS/Windows 各跑通 MySQL 直连单链路（#25）；linux 由上面 test job 的
      # mysql:8 service 容器覆盖（全量含 SSH 隧道），不在此重复
      - name: MySQL single-link test (native arch)
        if: (matrix.goos == 'darwin' && matrix.goarch == 'arm64') || matrix.goos == 'windows'
        shell: bash
        run: |
          set -e
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install mysql >/dev/null
            brew services start mysql
            sleep 5
            mysql -uroot -e "CREATE DATABASE IF NOT EXISTS lazytest;"
            DSN="root@tcp(127.0.0.1:3306)/lazytest?timeout=5s"
          else
            # runner 的 docker 是 Windows 容器模式，拉不了 linux mysql 镜像；choco zip 版
            # 自动 --initialize-insecure 并装成 Windows 服务（root 无密码）。
            # 钉 8.0.46：免 9.x 行为漂移
            choco install -y --no-progress mysql --version=8.0.46
            export PATH="/c/tools/mysql/current/bin:$PATH"
            for i in $(seq 1 30); do mysqladmin -uroot ping --silent && break; sleep 2; done
            mysql -uroot -e "CREATE DATABASE IF NOT EXISTS lazytest;"
            DSN="root@tcp(127.0.0.1:3306)/lazytest?timeout=5s"
          fi
          LAZYDB_MYSQL_DSN="$DSN" go test -count=1 -timeout 120s -run 'TestMySQLFullChainDirect|TestMySQLReadOnlyRollbackCTEWrite' ./internal/api/
      - uses: actions/upload-artifact@v4
        with:
          name: lazydb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            lazydb-driver-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
            lazydb-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
